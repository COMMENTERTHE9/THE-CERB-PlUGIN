# Cerberus Combat Configuration
# All combat tuning values live here, separate from infrastructure config.
config-version: 3

knockback:
  base-strength: 0.4
  damage-scale: 0.06
  sprint-bonus: 0.3
  vertical-lift: 0.35
  max-horizontal: 1.5
  max-vertical: 0.5
  momentum-blend: 0.3
  projectile-base: 0.3
  projectile-damage-scale: 0.02
  cooldown: 0.5

# ── 3-Layer Defense System ──────────────────────────────────
# Pipeline: raw → elemental resist → armor reduction → defense bar → health

armor:
  reduction-per-piece:
    leather: 0.02
    gold: 0.02
    chainmail: 0.03
    iron: 0.04
    diamond: 0.05
    netherite: 0.06
  max-reduction: 0.40

# Fire resistance (Survival + Fortitude) covers these kinds of fire, each with a share of it:
# 1.0 = the full resistance, 0.5 = half, 0 = none. Still bounded by attributes.yml limits.resist
# and the 75% total damage-reduction cap. PvP keeps its pre-Attributes-2.0 rules.
fire-resistance:
  standing-in-fire: 1.0   # inside fire blocks
  burning: 1.0            # on fire afterwards (also Fire Aspect, Flame, Fireball's afterburn)
  fire-spells: 1.0        # Pyromancy and spell burns
  campfire: 1.0
  magma-block: 1.0
  lava: 0.5               # lava stays dangerous: half the resistance

defense-bar:
  base-max-points: 300
  max-absorption: 0.70
  regen-rate: 15.0
  regen-delay-ms: 7000

health-regen:
  base-rate: 2.0           # HP per second when out of combat
  combat-rate: 0.0         # HP per second while in combat (0 = no regen)
  combat-timeout-ms: 8000  # ms after last hit before "out of combat"

damage-timing:
  invincibility-ms: 250
  respawn-invincibility-ms: 3000

# ── Mob Damage Scaling ──────────────────────────────────────
# Multiplier applied to mob-to-player damage based on mob tier and level (melee; ranged below, with its own caps).
# Formula: tierBase * (1 + levelScale * log1p(level / levelPivot)), capped at max.
mob-damage-scaling:
  enabled: true
  level-scale: 0.55
  level-pivot: 25.0
  max-damage-multiplier: 10.0
  tier-base:
    WEAK: 0.85
    COMMON: 1.0
    UNCOMMON: 1.15
    RARE: 1.35
    EPIC: 1.75
    LEGENDARY: 2.25
    PERFECT: 2.5
    MYTHIC: 3.0
    GODLY: 3.75
    PRIMORDIAL: 4.5
  # Ranged attacks (owner decision 10, 2026-10-27): mob arrows, tridents, fireballs, wither skulls, shulker
  # bullets, thrown potions and evoker fangs scale with the same tier x level multiplier as melee, within
  # two caps that keep high-level ranged mobs dangerous but fair. An older combat.yml without this section
  # uses these values.
  ranged:
    enabled: true
    max-damage-multiplier: 6.0   # lower than melee's 10: ranged mobs hit from out of reach, often in groups
    max-hit-share: 0.35          # one ranged hit takes at most 35% of the target's max health (0 = no limit);
                                 # a hit is never made weaker than its vanilla damage

# ── Mob Health Scaling (controlled-hyperscaling realm curve) ───
# Mobs get a DOUBLE virtual-HP pool (MobVirtualHealthManager), so HP can reach
# billions — the vanilla MAX_HEALTH attribute (capped at 1024) is only cosmetic.
# Level comes from distance to world spawn: level = 1 + floor(distance / blocks-per-level).
# Health: maxHealth = clamp( base-health * tier-multiplier * (1 + level-slope*(level-1)), 1, health-cap )
# tier-multiplier is a geometric x8/realm staircase (COMMON=1 .. PRIMORDIAL=8^8).
mob-health-scaling:
  enabled: true
  base-health: 50.0        # HP anchor: a level-1 COMMON mob
  level-slope: 0.05        # within-realm climb: x1.0 at L1 .. x5.95 at L100
  health-cap: 1.0e14       # sanity rail only (well under a double's 2^53) — NOT a balance cap
  blocks-per-level: 150.0  # every N blocks from world spawn = +1 mob level
  max-level: 100           # hard cap on mob level
  apply-to: ALL            # ALL = every mob gets a label; MONSTERS = hostiles only
  show-level-in-name: true # prefix generic mob names with "Lv<n>"
  name-always-visible: true    # floats above the mob (set false for hover-only)
  tier-multiplier:         # x8 per realm: 8^realmIndex (Mortal .. Primordial)
    WEAK: 0.125
    COMMON: 1.0
    UNCOMMON: 8.0
    RARE: 64.0
    EPIC: 512.0
    LEGENDARY: 4096.0
    PERFECT: 32768.0
    MYTHIC: 262144.0
    GODLY: 2097152.0
    PRIMORDIAL: 16777216.0

# ── Unified Tier System ─────────────────────────────────────
# Used for mobs, items, regions, loot — everything.
tiers:
  WEAK:       { armor-penetration: 0.00, xp-multiplier: 0.5,  craft-stat-multiplier: 0.5  }
  COMMON:     { armor-penetration: 0.00, xp-multiplier: 1.0,  craft-stat-multiplier: 1.0  }
  UNCOMMON:   { armor-penetration: 0.10, xp-multiplier: 1.5,  craft-stat-multiplier: 1.25 }
  RARE:       { armor-penetration: 0.20, xp-multiplier: 2.0,  craft-stat-multiplier: 1.5  }
  EPIC:       { armor-penetration: 0.30, xp-multiplier: 3.0,  craft-stat-multiplier: 1.75 }
  LEGENDARY:  { armor-penetration: 0.40, xp-multiplier: 4.0,  craft-stat-multiplier: 2.0  }
  PERFECT:    { armor-penetration: 0.50, xp-multiplier: 5.0,  craft-stat-multiplier: 2.5  }
  MYTHIC:     { armor-penetration: 0.60, xp-multiplier: 7.0,  craft-stat-multiplier: 3.0  }
  GODLY:      { armor-penetration: 0.70, xp-multiplier: 10.0, craft-stat-multiplier: 3.5  }
  PRIMORDIAL: { armor-penetration: 0.80, xp-multiplier: 15.0, craft-stat-multiplier: 4.0  }

display:
  combo-timeout-ms: 5000
  damage-number-ticks: 20
  crit-damage-number-ticks: 30
  combo-threshold: 2
  mob-damage-numbers: true   # floating damage numbers (crits marked) when players hit mobs

sound:
  hit-cooldown-ms:
    melee: 200
    projectile: 200
    contact: 500
    environmental: 500
    status-effect: 800
    default: 400

# ── Skill Scaling ────────────────────────────────────────────
# Each stat uses the Log-Sigmoid formula:
#   value = base + logScale * log1p(level) + lateBonus * sigmoid(level)
#   sigmoid = 1 / (1 + exp(-steepness * (level - inflection)))
#   output clamped to [0, hardCap]
#
# Available presets: STEADY, LATE_SURGE, HARD_CAPPED, FLAT_DEFENSIVE
# Any field not explicitly set inherits from the preset.
# scaling-defaults provides fallback values when neither preset nor explicit value is set.

skills:
  scaling-defaults:
    log-scale: 0.04
    late-game-steepness: 0.08
    late-game-start: 60

  critical-strike:
    crit-chance:
      preset: HARD_CAPPED
      base: 0.10
      hard-cap: 0.75
      late-game-bonus: 0.50
    crit-multiplier:
      preset: LATE_SURGE
      base: 1.5
      hard-cap: 3.5
      late-game-bonus: 1.5

  weapon-mastery:
    damage-multiplier:
      preset: LATE_SURGE
      base: 1.15
      hard-cap: 2.5
      late-game-bonus: 1.0
    lifesteal:
      preset: HARD_CAPPED
      base: 0.0
      hard-cap: 0.40
      late-game-bonus: 0.30
      late-game-start: 50

  blade-mastery:
    damage-bonus:
      preset: STEADY
      base: 0.0
      hard-cap: 1.5
      late-game-bonus: 0.80
    speed-bonus:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50

  martial-expertise:
    kb-resist:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50
      late-game-bonus: 0.20
    disarm-chance:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.30
      late-game-bonus: 0.15
    disarm-duration-ticks: 100

  heavy-armor-training:
    kb-reduction:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50
      late-game-bonus: 0.25
    armor-bonus:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.15
      late-game-bonus: 0.10
    defense-bar-bonus:
      preset: STEADY
      base: 0.0
      hard-cap: 200.0
      late-game-bonus: 100.0
