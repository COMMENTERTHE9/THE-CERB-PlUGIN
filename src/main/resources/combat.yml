# Cerberus Combat Configuration
# All combat tuning values live here, separate from infrastructure config.
config-version: 3

knockback:
  base-strength: 0.4
  damage-scale: 0.06
  sprint-bonus: 0.3
  vertical-lift: 0.35
  max-horizontal: 1.5
  max-vertical: 0.5
  momentum-blend: 0.3
  projectile-base: 0.3
  projectile-damage-scale: 0.02
  cooldown: 0.5

# ── 3-Layer Defense System ──────────────────────────────────
# Pipeline: raw → elemental resist → armor reduction → defense bar → health

armor:
  reduction-per-piece:
    leather: 0.02
    gold: 0.02
    chainmail: 0.03
    iron: 0.04
    diamond: 0.05
    netherite: 0.06
  max-reduction: 0.40

defense-bar:
  base-max-points: 300
  max-absorption: 0.70
  regen-rate: 15.0
  regen-delay-ms: 7000

health-regen:
  base-rate: 2.0           # HP per second when out of combat
  combat-rate: 0.0         # HP per second while in combat (0 = no regen)
  combat-timeout-ms: 8000  # ms after last hit before "out of combat"

damage-timing:
  invincibility-ms: 250
  respawn-invincibility-ms: 3000

# ── Mob Damage Scaling ──────────────────────────────────────
# Multiplier applied to melee mob-to-player damage based on mob tier and level.
# Formula: tierBase * (1 + levelScale * log1p(level / levelPivot)), capped at max.
mob-damage-scaling:
  enabled: true
  level-scale: 0.55
  level-pivot: 25.0
  max-damage-multiplier: 10.0
  tier-base:
    WEAK: 0.85
    COMMON: 1.0
    UNCOMMON: 1.15
    RARE: 1.35
    EPIC: 1.75
    LEGENDARY: 2.25
    PERFECT: 2.5
    MYTHIC: 3.0
    GODLY: 3.75
    PRIMORDIAL: 4.5

# ── Mob Health Scaling ──────────────────────────────────────
# Scales a mob's MAX HEALTH on spawn from its tier and level.
# Level comes from how far the mob spawned from world spawn:
#   level = 1 + floor(distance / blocks-per-level), capped at max-level
# Health:
#   maxHealth = min( (base-health + level * hp-per-level) * tier-multiplier, health-cap )
mob-health-scaling:
  enabled: true
  base-health: 20.0        # HP for a level-1 COMMON mob (before tier multiplier)
  hp-per-level: 6.0        # added HP per mob level (before tier multiplier)
  health-cap: 5000.0       # absolute ceiling so the health attribute never explodes
  blocks-per-level: 150.0  # every N blocks from world spawn = +1 mob level
  max-level: 100           # hard cap on mob level
  apply-to: MONSTERS       # MONSTERS = hostile mobs only, ALL = every living mob
  show-level-in-name: true # prefix generic mob names with "Lv<n>"
  name-always-visible: false   # true = name floats above mob, false = on hover only
  tier-multiplier:
    WEAK: 0.5
    COMMON: 1.0
    UNCOMMON: 1.5
    RARE: 3.0
    EPIC: 6.0
    LEGENDARY: 10.0
    PERFECT: 16.0
    MYTHIC: 25.0
    GODLY: 40.0
    PRIMORDIAL: 60.0

# ── Unified Tier System ─────────────────────────────────────
# Used for mobs, items, regions, loot — everything.
tiers:
  WEAK:       { armor-penetration: 0.00, xp-multiplier: 0.5,  craft-stat-multiplier: 0.5  }
  COMMON:     { armor-penetration: 0.00, xp-multiplier: 1.0,  craft-stat-multiplier: 1.0  }
  UNCOMMON:   { armor-penetration: 0.10, xp-multiplier: 1.5,  craft-stat-multiplier: 1.25 }
  RARE:       { armor-penetration: 0.20, xp-multiplier: 2.0,  craft-stat-multiplier: 1.5  }
  EPIC:       { armor-penetration: 0.30, xp-multiplier: 3.0,  craft-stat-multiplier: 1.75 }
  LEGENDARY:  { armor-penetration: 0.40, xp-multiplier: 4.0,  craft-stat-multiplier: 2.0  }
  PERFECT:    { armor-penetration: 0.50, xp-multiplier: 5.0,  craft-stat-multiplier: 2.5  }
  MYTHIC:     { armor-penetration: 0.60, xp-multiplier: 7.0,  craft-stat-multiplier: 3.0  }
  GODLY:      { armor-penetration: 0.70, xp-multiplier: 10.0, craft-stat-multiplier: 3.5  }
  PRIMORDIAL: { armor-penetration: 0.80, xp-multiplier: 15.0, craft-stat-multiplier: 4.0  }

display:
  combo-timeout-ms: 5000
  damage-number-ticks: 20
  crit-damage-number-ticks: 30
  combo-threshold: 2

sound:
  hit-cooldown-ms:
    melee: 200
    projectile: 200
    contact: 500
    environmental: 500
    status-effect: 800
    default: 400

# ── Skill Scaling ────────────────────────────────────────────
# Each stat uses the Log-Sigmoid formula:
#   value = base + logScale * log1p(level) + lateBonus * sigmoid(level)
#   sigmoid = 1 / (1 + exp(-steepness * (level - inflection)))
#   output clamped to [0, hardCap]
#
# Available presets: STEADY, LATE_SURGE, HARD_CAPPED, FLAT_DEFENSIVE
# Any field not explicitly set inherits from the preset.
# scaling-defaults provides fallback values when neither preset nor explicit value is set.

skills:
  scaling-defaults:
    log-scale: 0.04
    late-game-steepness: 0.08
    late-game-start: 60

  critical-strike:
    crit-chance:
      preset: HARD_CAPPED
      base: 0.10
      hard-cap: 0.75
      late-game-bonus: 0.50
    crit-multiplier:
      preset: LATE_SURGE
      base: 1.5
      hard-cap: 3.5
      late-game-bonus: 1.5

  weapon-mastery:
    damage-multiplier:
      preset: LATE_SURGE
      base: 1.15
      hard-cap: 2.5
      late-game-bonus: 1.0
    lifesteal:
      preset: HARD_CAPPED
      base: 0.0
      hard-cap: 0.40
      late-game-bonus: 0.30
      late-game-start: 50

  blade-mastery:
    damage-bonus:
      preset: STEADY
      base: 0.0
      hard-cap: 1.5
      late-game-bonus: 0.80
    speed-bonus:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50

  martial-expertise:
    kb-resist:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50
      late-game-bonus: 0.20
    disarm-chance:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.30
      late-game-bonus: 0.15
    disarm-duration-ticks: 100

  heavy-armor-training:
    kb-reduction:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.50
      late-game-bonus: 0.25
    armor-bonus:
      preset: FLAT_DEFENSIVE
      base: 0.0
      hard-cap: 0.15
      late-game-bonus: 0.10
    defense-bar-bonus:
      preset: STEADY
      base: 0.0
      hard-cap: 200.0
      late-game-bonus: 100.0
