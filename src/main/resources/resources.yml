    nether_vines:       { name: Nether Vines, blocks: [WEEPING_VINES, WEEPING_VINES_PLANT, TWISTING_VINES, TWISTING_VINES_PLANT], produce: [WEEPING_VINES, TWISTING_VINES], level: 35, xp: 5, discovery-xp: 80, grows: "the Nether", rare: emberbloom }
    wither_rose:        { name: Wither Rose, blocks: [WITHER_ROSE], level: 40, xp: 12, discovery-xp: 100, grows: "where the wither or its victims fell" }
    chorus_flower:      { name: Chorus Flower, blocks: [CHORUS_FLOWER], level: 40, xp: 10, discovery-xp: 100, grows: "the End" }

# Alchemy (docs/design/ALCHEMY.md). Rules the code keeps whatever this file says: a completed brew pays the player whose click
# started it, per bottle (a stand hoppers started pays nobody; creative pays nothing); a Cerberus brew below its level, or
# started by nobody, comes out a Mundane Potion. "alchemy: off" turns it off.
#   vanilla-xp: per bottle of a vanilla brew. tiers / potency / duration: as Cooking's (the alchemist's level when the brew
#   starts; a reagent with a quality, or the brew's lift, makes it one tier better).
#   brews: kind draught (restore: a share of max health over its seconds) or elixir (effects for minutes, one at a time);
#   reagent: a material (never one of vanilla brewing's own) or a rare reagent's id; lift: a rare reagent that stands in for
#   the reagent and lifts the tier; color: the bottle's colour.
alchemy:
  skill: Alchemy
  vanilla-xp: 2
  tiers: { fine: 25, superior: 50, masterwork: 75 }
  potency:  { common: 1.0, fine: 1.2, superior: 1.4, masterwork: 1.6 }
  duration: { common: 1.0, fine: 1.25, superior: 1.5, masterwork: 2.0 }
  brews:
    mending:
      name: Draught of Mending
      kind: draught
      level: 10
      xp: 6
      reagent: POPPY
      color: "#C0392B"
      restore: { share: 0.25, seconds: 5 }
    swiftness:
      name: Tonic of Swiftness
      kind: elixir
      level: 15
      xp: 6
      reagent: CORNFLOWER
      color: "#5DADE2"
      minutes: 8
      effects: [ { stat: movement-speed, amount: 0.08 } ]
    vigor:
      name: Elixir of Vigor
      kind: elixir
      level: 20
      xp: 8
      reagent: DANDELION
      lift: sunpetal
      color: "#F4D03F"
      minutes: 8
      effects: [ { attribute: vitality, amount: 8 } ]
    stoneskin:
      name: Elixir of Stoneskin
      kind: elixir
      level: 25
      xp: 8
      reagent: ALLIUM
      color: "#95A5A6"
      minutes: 8
      effects: [ { attribute: fortitude, amount: 8 } ]
    insight:
      name: Philter of Insight
      kind: elixir
      level: 30
      xp: 10
      reagent: LILY_OF_THE_VALLEY
      color: "#A9CCE3"
      minutes: 8
      effects: [ { attribute: essence, amount: 10 } ]
    might:
      name: Elixir of Might
      kind: elixir
      level: 40
      xp: 12
      reagent: CRIMSON_FUNGUS
      lift: emberbloom
      color: "#E74C3C"
      minutes: 6
      effects: [ { attribute: power, amount: 4 } ]
    bloodroot:
      name: Bloodroot Draught
      kind: draught
      level: 50
      xp: 16
      reagent: bloodroot
      color: "#7B241C"
      restore: { share: 0.40, seconds: 4 }
    moonlit:
      name: Moonlit Elixir
      kind: elixir
      level: 60
      xp: 20
      reagent: moonpetal
      color: "#D6EAF8"
      minutes: 10
      effects: [ { attribute: vitality, amount: 6 }, { attribute: fortitude, amount: 6 }, { attribute: essence, amount: 6 } ]

# Cooking (docs/design/FARMING_COOKING.md §4). Rules the code keeps whatever this file says: only food a player really
# makes pays (taken out of a furnace or smoker, or crafted at a grid; the game's crafted-items statistic counts it, so a
# shift-click pays every item and a click that makes nothing pays nothing); hoppers, crafters and campfires pay nobody;
# creative earns nothing. Meals give one effect at a time, through the attribute engine and its caps.
cooking:
  skill: Cooking
  # XP each when a player takes this food out of a furnace or smoker.
  furnace: { COOKED_BEEF: 3, COOKED_PORKCHOP: 3, COOKED_MUTTON: 3, COOKED_CHICKEN: 3, COOKED_RABBIT: 3, COOKED_COD: 3, COOKED_SALMON: 4, BAKED_POTATO: 2, DRIED_KELP: 0.25 }
  # XP each for food crafted by a vanilla recipe (reversible storage recipes, such as dried kelp blocks, never pay).
  crafting: { BREAD: 4, COOKIE: 1, PUMPKIN_PIE: 6, MUSHROOM_STEW: 6, BEETROOT_SOUP: 6, RABBIT_STEW: 12, CAKE: 20, GOLDEN_CARROT: 5 }
  # A meal's tier is the cook's Cooking level (from these levels), one higher when at least half of its crop ingredients
  # have a quality (Farming). Each tier multiplies every number of the effect (potency) and how long it lasts (duration).
  tiers: { fine: 25, superior: 50, masterwork: 75 }
  potency:  { common: 1.0, fine: 1.2, superior: 1.4, masterwork: 1.6 }
  duration: { common: 1.0, fine: 1.25, superior: 1.5, masterwork: 2.0 }
  # Meals: crafted (shapeless) at a crafting table from the level they open at; "item" is the edible vanilla item it is
  # made on (its food points stay vanilla; meals can be eaten at full hunger). "#cooked_meat" is any cooked meat,
  # "#cooked_fish" cod or salmon. Effects: { attribute: vitality|power|fortitude|..., amount } (fortune may add a yield:
  # ore, wood, fish, crops), or { stat: movement-speed|lure-speed|..., amount } as a fraction (0.08 = +8%);
  # restore: a share of max health healed over its seconds (paused in PvP). Eating one replaces the running meal.
  meals:
    hearty_stew:
      name: Hearty Stew
      role: Survival
      item: RABBIT_STEW
      level: 10
      xp: 20
      recipe: [BOWL, "#cooked_meat", CARROT, POTATO, BEETROOT]
      minutes: 10
      effects: [ { attribute: vitality, amount: 6 } ]
      restore: { share: 0.25, seconds: 20 }
    farmers_breakfast:
      name: Farmer's Breakfast
      role: Harvesting
      item: BAKED_POTATO
      level: 15
      xp: 30
      recipe: [BREAD, EGG, COOKED_PORKCHOP, SWEET_BERRIES]
      minutes: 15
      effects: [ { attribute: fortune, amount: 10, yield: crops } ]
    trail_ration:
      name: Trail Ration
      role: Exploration
      item: COOKED_RABBIT
      level: 20
      xp: 40
      recipe: [BREAD, DRIED_KELP, SWEET_BERRIES, COCOA_BEANS]
      minutes: 15
      effects: [ { stat: movement-speed, amount: 0.08 } ]
    anglers_platter:
      name: Angler's Platter
      role: Fishing
      item: COOKED_SALMON
      level: 25
      xp: 50
      recipe: [COOKED_SALMON, COOKED_COD, BEETROOT, WHEAT]
      minutes: 15
      effects: [ { stat: lure-speed, amount: 0.06 }, { stat: sea-creature-chance, amount: 0.01 } ]
    miners_pasty:
      name: Miner's Pasty
      role: Gathering
      item: PUMPKIN_PIE
      level: 35
      xp: 60
      recipe: [PUMPKIN_PIE, COOKED_BEEF, CARROT, WHEAT]
      minutes: 15
      effects: [ { stat: gather-speed, amount: 0.08 }, { stat: chop-speed, amount: 0.08 } ]
    warriors_feast:
      name: Warrior's Feast
      role: A hard fight
      item: BEETROOT_SOUP
      level: 50
      xp: 80
      recipe: [BOWL, COOKED_BEEF, GOLDEN_CARROT, BAKED_POTATO, NETHER_WART]
      minutes: 10
      effects: [ { attribute: power, amount: 3 }, { attribute: fortitude, amount: 4 } ]
      restore: { share: 0.15, seconds: 10 }

# XP when a player takes these out of a furnace or blast furnace (hoppers pay nobody).
smelting:
  skill: Smithing
  xp: { IRON_INGOT: 2, GOLD_INGOT: 3, COPPER_INGOT: 1, NETHERITE_SCRAP: 25 }

# XP for crafting gear: per unit of metal its shape takes (a sword 2, a chestplate 8...); storage blocks,
# nuggets and other reversible recipes pay nothing. "items:" sets one item's XP outright.
forging:
  skill: Smithing
  per-unit: { iron: 5, gold: 5, copper: 3, diamond: 20 }
  netherite-upgrade: 50
  # Metal a farm makes without mining (iron golems, zombified piglins, drowned) pays forging XP and rolls a
  # quality only as far as you smelted it yourself: each ingot you take out of a furnace covers one unit.
  # Gear made from other metal is plain vanilla gear. An empty list pays for any metal.
  needs-smelted: [iron, gold, copper]
  items: {}

# Forged gear rolls a quality, better with Smithing (odds between level 1 and level 100). What each
# quality adds goes through the attribute engine and its caps: Power for the weapon type in hand,
# Fortitude per armor piece worn, Fortune with the tool in hand.
quality:
  skill: Smithing
  odds:
    at-level-1:   { common: 85, fine: 13, superior: 2, masterwork: 0 }
    at-level-100: { common: 20, fine: 40, superior: 28, masterwork: 12 }
  weapon-power:    { fine: 3, superior: 6, masterwork: 10 }
  armor-fortitude: { fine: 1, superior: 2, masterwork: 4 }
  tool-fortune:    { fine: 3, superior: 6, masterwork: 10 }
