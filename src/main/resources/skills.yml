# ═══════════════════════════════════════════════════════════════════
# Cerberus Skill Trigger Routing
# ═══════════════════════════════════════════════════════════════════
#
# Determines which skill gets XP when a mob is killed, based on the
# weapon the player was holding.
#
# RULES:
#   - Lower priority number = matched first
#   - At same priority: exact 'materials' checked before 'material-regex'
#   - First match wins — no further entries checked
#   - If no config match: elemental tag → armor fallback → no XP
#
# MATCH TYPES:
#   materials:       Exact material name list (fast O(1) lookup)
#   material-regex:  Regex patterns against Material.name() (checked in order)
#
# Only combat/magic skills belong here. Utility skills (Mining, Farming,
# Woodcutting, etc.) get XP from block-break events, not mob kills.
# ═══════════════════════════════════════════════════════════════════

skill-triggers:

  # ── Combat Skills ────────────────────────────────────────────────

  Blade Mastery:
    priority: 10
    match:
      material-regex:
        - ".*_SWORD"

  Spell Weaving:
    # Spell focus items — wands, rods, staves. Matched before axes/weapons
    # so holding a BLAZE_ROD routes to magic, not the armor fallback.
    priority: 15
    match:
      materials:
        - "BLAZE_ROD"
        - "BREEZE_ROD"
        - "END_ROD"
        - "STICK"
      material-regex:
        - ".*WAND.*"
        - ".*STAFF.*"

  Weapon Mastery:
    priority: 20
    match:
      materials:
        - "MACE"
        - "TRIDENT"
      material-regex:
        - ".*_AXE"
        - ".*_SPEAR"

  Ranged Precision:
    priority: 30
    match:
      materials:
        - "BOW"
        - "CROSSBOW"

  Arcane Knowledge:
    priority: 40
    match:
      materials:
        - "ENCHANTED_BOOK"

  Martial Expertise:
    # AIR = empty main hand (fist fighting).
    # Also matches when a stack runs out or the slot is empty for any
    # reason — acceptable edge case for unarmed combat.
    priority: 100
    match:
      materials:
        - "AIR"

# ── Magic Settings ─────────────────────────────────────────────────

magic:
  # Spell focus users get kill XP (from MobKillListener) AND cast XP
  # (from SpellManager). Set to false if spell users level too fast.
  award-kill-xp-for-spell-focus: true

  # Skills considered "magic" for the toggle above.
  # If the matched skill name is in this list and the toggle is false,
  # kill XP is suppressed (cast XP from SpellManager still fires).
  magic-skills:
    - "Spell Weaving"
    - "Arcane Knowledge"
    - "Elemental Mastery"
    - "Intelligence"
    - "Summoning"
    - "Mana Regeneration"
    - "Defensive Magic"
