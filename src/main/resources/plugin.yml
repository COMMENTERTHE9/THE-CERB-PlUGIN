name: CerberusPlugin
main: cerberus.world.cerb.CerberusPlugin
version: 1.1.0
api-version: '1.21'
folia-supported: true

commands:
  cerb:
    description: Umbrella admin command
    usage: /cerb <reload|...|healthstate|showqueues>
    permission: cerb.admin
    permission-message: You do not have permission to use /cerb.
  stats:
    description: Your character sheet - attributes, damage, crits and what your next levels give.
    usage: /<command>
  menu:
    description: Open your Player Menu (same as right-clicking the head in hotbar slot 9).
    usage: /<command>
  class:
    description: Your classes, abilities and loadouts.
    usage: /<command> [info] | abilities [class] | equip [loadout] <a1-a5|p1-p3|k> <ability|none> | loadout <n> | name <n> <name>
    aliases: [classes]
  xpdisplay:
    description: How XP gains show on your HUD - compact, detailed or off.
    usage: /<command> [compact|detailed|off]
    aliases: [xphud]
  levelup:
    description: How level-ups and rank-ups show - full, reduced or off.
    usage: /<command> [full|reduced|off]
    aliases: [levelups]
  fishing:
    description: Your fishing journal, banked encounters, the species you track and which creature a Sneak-cast calls.
    usage: /<command> [journal [water] | encounters | track <species|off> | call <creature> | cue on|off]
    aliases: [fish]
  cooking:
    description: The tier you cook meals at, your running meal and the cookbook.
    usage: /<command> [book]
    aliases: [cook]
  farming:
    description: Your crops, Farming's techniques and Replant's switch.
    usage: /<command> [crops | replant on|off]
    aliases: [farm]
  herbalism:
    description: Your herbs, rare reagents and Herbalism's techniques; the Herbarium.
    usage: /<command> [herbs | rare]
    aliases: [herbs]
  giveTestItem:
    description: Gives a test item to the player.
    usage: /<command>
    permission: cerberus.give.testitem
  testregen:
    description: Test the virtual health regeneration system.
    usage: /<command> <damage>
    permission: cerberus.test.regen
  givetestarmor:
    description: Gives the player a custom test armor piece.
    usage: /<command>
    permission: cerberus.give.testarmor
  spawncustomzombie:
    description: Spawns a custom high-health zombie.
    usage: /spawncustomzombie <extraHealth>
    permission: cerberus.spawn.customzombie

permissions:
  cerb.admin:
    description: Allows use of the Cerberus umbrella admin command.
    default: op
  cerberus.give.testitem:
    description: Allows the player to use the giveTestItem command.
    default: op
  cerberus.test.regen:
    description: Allows the player to use the testregen command.
    default: op
  cerberus.give.testarmor:
    description: Allows the player to use the givetestarmor command.
    default: op
  cerberus.spawn.customzombie:
    description: Allows the player to use the spawncustomzombie command.
    default: op
  cerberus.*:
    description: Gives access to all Cerberus plugin commands and features.
    children:
      cerb.admin: true
      cerberus.give.testitem: true
      cerberus.test.regen: true
      cerberus.give.testarmor: true
      cerberus.spawn.customzombie: true
