name: CerbTestProtect
version: 1.0
main: cerbtest.Protect
api-version: '1.21'
folia-supported: true
description: Sandbox-only test helpers (woodcutting.js protect, fishing.js crash-set, fishgear.js bait). Never ship it.
commands:
  testprotect:
    description: Refuse block breaks inside a box (x1 y1 z1 x2 y2 z2), or "off".
    usage: /testprotect <x1> <y1> <z1> <x2> <y2> <z2> | off
    permission: cerbtest.protect
  testsave:
    description: Write a player's data to disk now (Folia has no save-all).
    usage: /testsave <player>
    permission: cerbtest.protect
  testnocatch:
    description: Refuse a player's catches (as another plugin may), or "off".
    usage: /testnocatch <player> | off
    permission: cerbtest.protect
permissions:
  cerbtest.protect:
    default: op
