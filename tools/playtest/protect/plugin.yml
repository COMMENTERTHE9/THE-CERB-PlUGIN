name: CerbTestProtect
version: 1.0
main: cerbtest.Protect
api-version: '1.21'
folia-supported: true
description: Sandbox-only test helpers (woodcutting.js protect, fishing.js crash-set, fishgear.js bait, herbalism.js nodrops, herbalism.js and alchemy.js compat). Never ship it.
commands:
  testprotect:
    description: Refuse block breaks inside a box (x1 y1 z1 x2 y2 z2), or "off".
    usage: /testprotect <x1> <y1> <z1> <x2> <y2> <z2> | off
    permission: cerbtest.protect
  testsave:
    description: Write a player's data to disk now (Folia has no save-all).
    usage: /testsave <player>
    permission: cerbtest.protect
  testnocatch:
    description: Refuse a player's catches (as another plugin may), or "off".
    usage: /testnocatch <player> | off
    permission: cerbtest.protect
  testnoreel:
    description: Refuse a player's empty reel-ins (the bobber stays out), or "off".
    usage: /testnoreel <player> | off
    permission: cerbtest.protect
  testnodrops:
    description: Cancel a player's block drops (as another plugin may), or "off".
    usage: /testnodrops <player> | off
    permission: cerbtest.protect
  testdrops:
    description: Change a player's block drops at HIGHEST without cancelling (clear, replace with dirt, double), or "off".
    usage: /testdrops <player> clear|replace|double|off  or  /testdrops off
    permission: cerbtest.protect
  testbrew:
    description: Cancel every brew, or replace its results with water bottles, after Cerberus; or "off".
    usage: /testbrew cancel|replace|off
    permission: cerbtest.protect
permissions:
  cerbtest.protect:
    default: op
